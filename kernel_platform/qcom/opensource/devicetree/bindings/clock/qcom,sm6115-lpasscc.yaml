%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm6115-lpasscc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm LPASS Core Clock Controller for SM6115

maintainers:
  - Taniya Das <quic_tdas@quicinc.com>
  - Chetan C R <quic_cchinnad@quicinc.com>

description: |
  Qualcomm LPASS core clock control module which supports the clocks and
  Reset Controller Binding on SM6115.

  See also:
  - dt-bindings/clock/qcom,lpassaoncc-khaje.h
  - dt-bindings/clock/qcom,lpassaudiocc-khaje.h

properties:
  compatible:
    enum:
      - qcom,lpassaoncc-khaje
      - qcom,lpassaudiocc-khaje

  clocks:
    items:
      - description: Board XO source

  clock-names:
    items:
      - const: bi_tcxo

  vdd_lpi_cx-supply:
    description: Phandle pointer to the vdd_cx L3A_LEVEL logic rail supply

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

  reg:
    items:
      - description: LPASS cc_base register

  reg-names:
    items:
      - const: cc_base

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmcc.h>
    #include <dt-bindings/clock/qcom,lpassaoncc-khaje.h>
    #include <dt-bindings/clock/qcom,lpassaudiocc-khaje.h>
    lpassaoncc: clock-controller@a780000 {
       status = "disabled";
       compatible = "qcom,lpassaoncc-khaje", "syscon";
       reg = <0xa780000 0x30000>;
       reg-name = "cc_base";
       vdd_lpi_cx-supply = <&L3A_LEVEL>;
       clocks = <&rpmcc RPM_SMD_XO_CLK_SRC>;
       clock-names = "bi_tcxo";
       #clock-cells = <1>;
       #reset-cells = <1>;
    };
...
