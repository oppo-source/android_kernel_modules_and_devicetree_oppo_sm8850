%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,av1ecc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. AV1E Clock Controller

maintainers:
  - Taniya Das <quic_tdas@quicinc.com>
  - Kalpak Kawadkar <quic_kkawadka@quicinc.com>

description: |
  AV1E clock control module which supports the clocks, resets and
  power domains on Qualcomm SoCs.

  See also:
    dt-bindings/clock/qcom,x1p42100-av1ecc.h

properties:
  compatible:
    enum:
      - qcom,x1p42100-av1ecc

  clocks:
    items:
      - description: Board XO source
      - description: Sleep clock source
      - description: AV1E's AHB clock

  clock-names:
    items:
      - const: bi_tcxo
      - const: sleep_clk
      - const: iface

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

  '#power-domain-cells':
    const: 1

  reg:
    maxItems: 1

  power-domains:
    description:
      A phandle and PM domain specifier for the MMCX power domain.
    maxItems: 1

  required-opps:
    description:
      A phandle to an OPP node describing required MMCX performance point.
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'
  - '#reset-cells'
  - '#power-domain-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmh.h>
    #include <dt-bindings/power/qcom-rpmpd.h>
    clock-controller@15220000 {
      compatible = "qcom,x1p42100-av1ecc";
      reg = <0x15220000 0x14000>;
      clocks = <&rpmhcc RPMH_CXO_CLK>;
      clock-names = "bi_tcxo";
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
      power-domains = <&rpmhpd RPMHPD_MMCX>;
      required-opps = <&rpmhpd_opp_low_svs>;
    };
...
